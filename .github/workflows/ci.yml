name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # Branch protection requires this one check, so the test matrix can change freely.
  ci-required:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success

  version:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: [ci-required]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      pkg-version: ${{ steps.version.outputs.pkg-version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          base=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_NAME" = main ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$base" > /dev/null; then
              echo "::error::v$base is already released, bump the version in Cargo.toml"
              exit 1
            fi
            version=$base
            pkg_version=$base
          else
            version="$base-dev.$GITHUB_RUN_NUMBER"
            # deb and rpm sort "~" before the release, "-" would sort after it
            pkg_version="$base~dev.$GITHUB_RUN_NUMBER"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pkg-version=$pkg_version" >> "$GITHUB_OUTPUT"

  package:
    name: package (${{ matrix.target }})
    needs: [version]
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      JLV_VERSION: ${{ needs.version.outputs.version }}
      PKG_VERSION: ${{ needs.version.outputs.pkg-version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild,cargo-deb,cargo-generate-rpm

      - name: Build
        run: |
          export JLV_COMMIT="${GITHUB_SHA:0:7}"
          if [ "$RUNNER_OS" = Linux ]; then
            cargo zigbuild --locked --release --target "$TARGET"
          else
            cargo build --locked --release --target "$TARGET"
          fi

      - name: Package
        run: |
          mkdir dist
          tar -czf "dist/jlv-$JLV_VERSION-$TARGET.tar.gz" -C "target/$TARGET/release" jlv
          if [ "$RUNNER_OS" = Linux ]; then
            cargo deb --no-build --no-strip --target "$TARGET" --deb-version "$PKG_VERSION" --output dist/
            cargo generate-rpm --target "$TARGET" --set-metadata "version = \"$PKG_VERSION\"" --output dist/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: jlv-${{ matrix.target }}
          path: dist/*

  publish:
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum -- * > SHA256SUMS

      - name: Publish dev build
        if: github.ref == 'refs/heads/develop'
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Development build $VERSION" \
            --notes "Built from ${GITHUB_SHA:0:7} on develop. Replaced on every push."

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        run: gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
