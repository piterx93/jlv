name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Runs the test suite with the coverage gate, see .cargo/config.toml
      - run: cargo cov
      # llvm-cov skips doctests on stable
      - run: cargo test --locked --doc

  # Branch protection requires this one check, so the jobs above can change freely.
  ci-required:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success

  version:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: [ci-required]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      pkg-version: ${{ steps.version.outputs.pkg-version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          base=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_NAME" = main ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$base" > /dev/null; then
              echo "::error::v$base is already released, bump the version in Cargo.toml"
              exit 1
            fi
            version=$base
            pkg_version=$base
          else
            version="$base-dev.$GITHUB_RUN_NUMBER"
            # deb and rpm sort "~" before the release, "-" would sort after it
            pkg_version="$base~dev.$GITHUB_RUN_NUMBER"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pkg-version=$pkg_version" >> "$GITHUB_OUTPUT"

  package:
    needs: [version]
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
      VILOG_VERSION: ${{ needs.version.outputs.version }}
      PKG_VERSION: ${{ needs.version.outputs.pkg-version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - run: sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build
        run: |
          VILOG_COMMIT="${GITHUB_SHA:0:7}" cargo build --locked --release --target "$TARGET"
          "target/$TARGET/release/vilog" --version

      - name: Package
        run: |
          mkdir dist
          tar -czf "dist/jlv-$VILOG_VERSION-$TARGET.tar.gz" -C "target/$TARGET/release" vilog
          cargo deb --no-build --no-strip --target "$TARGET" --deb-version "$PKG_VERSION" --output dist/
          cargo generate-rpm --target "$TARGET" --set-metadata "version = \"$PKG_VERSION\"" --output dist/

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*

  publish:
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      # GitHub turns "~" in asset names into ".", rename up front so SHA256SUMS matches
      - run: |
          cd dist
          shopt -s nullglob
          for f in *~*; do mv -- "$f" "${f//\~/.}"; done
          sha256sum -- * > SHA256SUMS

      - name: Publish dev build
        if: github.ref == 'refs/heads/develop'
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Development build $VERSION" \
            --notes "Built from ${GITHUB_SHA:0:7} on develop. Replaced on every push."

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        run: gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
