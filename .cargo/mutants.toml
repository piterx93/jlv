# main.rs only hands the command line to the library, where the logic and its tests live.
exclude_globs = ["src/main.rs"]

exclude_re = [
    # `run` only sets up the real terminal around `event_loop`; testing it needs a tty.
    'src/lib\.rs:\d+:\d+: replace run -> io::Result<\(\)> with Ok\(\(\)\)$',
    # The same goes for the flags `run` hands to `App::new`.
    'src/lib\.rs:\d+:\d+: delete ! in run$',
    # `at >= start` only differs for a first character wider than the whole line; the
    # message column is at least 19 columns wide and no character is wider than 2.
    'src/ui/table\.rs:\d+:41: replace > with >= in wrap$',
    # Stepping from the cached line mark or from the entry's start finds the same line;
    # the comparison only picks the shorter walk.
    'src/app/mod\.rs:\d+:\d+: replace > with (==|<|>=) in App::entry_line$',
    # `unfolded` is only compared with itself, before and after the entries are pushed
    # again, so flipping whether an entry shows its lines changes no comparison.
    'src/app/mod\.rs:\d+:61: replace > with == in unfolded$',
    # The settling time only decides how many looks a burst of writes costs; what is
    # read stays the same, and counting looks would make a test depend on timing.
    'src/follow/watcher\.rs:\d+:\d+: replace \+ with - in settle$',
    # notify resolves a relative path against the working directory, so watching the
    # empty parent of a bare file name watches `.` just the same.
    'src/follow/watcher\.rs:\d+:\d+: replace match guard !parent\.as_os_str\(\)\.is_empty\(\) with true in watch_parent$',
    # Missing a stop while settling only matters when the watcher is dropped within
    # the few milliseconds after a wakeup; a test for that would race.
    'src/follow/watcher\.rs:\d+:\d+: replace settle -> bool with true$',
    # Reading a regular file isn't interrupted by signals, so no test can make it so.
    'src/follow/watcher\.rs:\d+:\d+: replace match guard err\.kind\(\) == io::ErrorKind::Interrupted with false in snapshot$',
]
