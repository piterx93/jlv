[package]
name = "jlv"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Terminal log viewer for Java application logs"
authors = ["Piotr Owczarek <piter19993@gmail.com>"]
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
flate2 = "1.1"
# The bundled tz database is a fallback for systems without one, e.g. a minimal
# container running the static binary.
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
memchr = "2.8"
memmap2 = "0.9"
notify = "8.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
regex = "1.11"
tempfile = "3"
unicode-width = "0.2"

[dev-dependencies]
insta = "1.49"
proptest = "1"

[profile.release]
lto = "thin"
strip = true

[package.metadata.deb]
section = "utils"

[package.metadata.generate-rpm]
auto-req = "no"
assets = [
    { source = "target/release/jlv", dest = "/usr/bin/jlv", mode = "755" },
]
